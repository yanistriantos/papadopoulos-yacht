<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking - Papadopoulos Yacht Parties</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <script src="script.js"></script>
    <header class="main-header">
      <nav class="navbar">
        <div class="logo">
          <h1>Papadopoulos</h1>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="event.html" class="active">Events</a></li>
          <li><a href="contact.html"> Contact</a></li>
        </ul>
      </nav>
    </header>

    <div class="contact-page">
      <h1>Contact us</h1>
    </div>

    <div class="contact-container">
      <h2>Fill out the form below and we will <br>contact you as soon as possible</h2>
      
      <!-- Replace the existing form in contact.html with this one -->
<form class="contact-form">
  <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
  </div>
  
  <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
  </div>
  
  <div class="form-group">
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone">
  </div>
  
  <div class="form-group">
      <label for="event-type">Event Type:</label>
      <select id="event-type" name="event-type" required>
          <option value="">Select event type</option>
          <option value="wedding">Wedding</option>
          <option value="corporate">Corporate Event</option>
          <option value="sunset">Sunset Cruise</option>
      </select>
  </div>
  
  <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4"></textarea>
  </div>
  
  <button type="submit" class="submit-button">Send Message</button>
</form>
    
    <footer>
      <div class="footer-content">
        <div class="footer-section">
          <h3>Contact Info</h3>
          <p>Email: info@papadopoulosyachts.com</p>
          <p>Phone: +1 234 567 890</p>
        </div>
        <div class="footer-section">
          <h3>Follow Us</h3>
          <div class="social-links">
            <a href="#" aria-label="Facebook">Facebook</a>
            <a href="#" aria-label="Instagram">Instagram</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Papadopoulos Yacht Parties. All rights reserved.</p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
